<!DOCTYPE html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comprá Fácil — Landing</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0}.lp-hero{grid-template-columns:minmax(0,1fr)}.lp-hero>*{min-width:0}.lp-cards{grid-template-columns:1fr}.nav-lbl{display:none}.nav-lbl-wrap{position:absolute!important;left:50%;bottom:6px;width:22px;margin-left:-11px}.nav-cta{display:none}.lp-join{grid-template-columns:1fr}.offer-track{grid-auto-columns:86%}.offer-track::-webkit-scrollbar,.nearby-track::-webkit-scrollbar{display:none}
@media(min-width:760px){.offer-track{grid-auto-columns:calc((100% - clamp(16px,2vw,28px))/2)}}
@media(min-width:1280px){.offer-track{grid-auto-columns:calc((100% - 2*clamp(16px,2vw,28px))/3)}}
.hero-basket{animation:cf-float 6s var(--ease-in-out) infinite}.hero-basket-img{animation:cf-edge-glow 11s ease-in-out 3s infinite}.hero-letter{display:inline-block;animation-name:cf-letter-flicker;animation-timing-function:steps(1,end);animation-iteration-count:infinite}.nav-tube-on{animation:cf-tube-on .7s steps(1,end) both}.nav-idle{animation:cf-tube-on 1s steps(1,end) both}
.offers-art{translate:0 -50%;animation:cf-float 7s var(--ease-in-out) infinite}.requested-art{animation:cf-float 8s var(--ease-in-out) infinite}.catalog-art{animation:cf-float 7s var(--ease-in-out) infinite}@media(max-width:899px){.offers-art{top:-40px!important;right:-14vw!important;width:50vw!important;max-width:300px;translate:none;z-index:0}.offers-head{position:relative;z-index:1}.offers-head h2{font-size:clamp(26px,7.4vw,40px)!important;white-space:nowrap}.offers-head p{max-width:70%}}@media(min-width:900px){.offers-head{padding-right:calc(clamp(150px,13vw,220px) + 2*var(--gutter))!important}}
@media(prefers-reduced-motion:reduce){.requested-art,.catalog-art,.offers-art,.hero-basket,.hero-basket-img,.hero-letter,.nav-tube-on,.nav-idle{animation:none!important}}
@media(min-width:760px){.lp-cards{grid-template-columns:repeat(3,1fr)}.lp-join{grid-template-columns:280px 1fr}}
@media(max-width:559px){.nav-brand .cf-neon{display:none}}
@media(min-width:640px){.nav-cta{display:block}}
@media(min-width:1180px){.nav-lbl{display:inline}.nav-lbl-wrap{position:relative!important;left:auto;bottom:auto;width:auto;margin-left:0}}
@media(min-width:960px){.lp-hero{grid-template-columns:1.1fr 1fr}}@media(max-width:959px){.hero-brand{justify-content:center}}@media(max-width:759px){.lp-sec{min-height:calc(100svh - 56px);box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;padding-top:28px!important}#hero.lp-sec{padding-top:16px!important}@media(max-width:759px){.lp-nav{min-height:56px!important;padding-top:4px!important;padding-bottom:4px!important}}.lp-sec>*{width:100%;box-sizing:border-box}#ofertas.lp-sec{justify-content:flex-start}.lp-hero{min-height:0!important}}</style></head><body><div id="root"></div>

<script type="text/babel">
function App(){const open=(t,id)=>{location.href='../map-app/index.html'+(t?'?type='+t+(id?'&id='+id:''):'')};
return <div><LandingNav onOpenMap={()=>open()}/><LandingHero onOpenMap={()=>open()}/><LandingOffers onOpenMap={open}/><LandingCatalog onOpenMap={open}/><LandingMostRequested onOpenMap={open}/><LandingNearby onOpenMap={open}/><LandingJoin/><LandingFooter/></div>}

</script></body></html>
