<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo/basket-mark-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fuentes autoalojadas (las @font-face están en src/index.css): se precargan para que el
         texto del hero aparezca ya con su tipografía y sin bloquear el primer pintado -->
    <link rel="preload" href="/fonts/Manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Glowtone-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Solo en la landing: la captura de la ciudad del hero (elemento LCP) se pide ya desde el HTML, en paralelo
         con el JS, en vez de esperar a que React la renderice. srcset/sizes deben coincidir con CITY_POSTER
         (src/features/landing/Hero.tsx) o el navegador la bajaría dos veces. -->
    <script>
      if (location.pathname === '/') {
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.fetchPriority = 'high'
        l.setAttribute('imagesrcset', [960, 1280, 1600, 2160].map(function (w) { return '/assets/scenes/city-' + w + '.webp ' + w + 'w' }).join(', '))
        l.setAttribute('imagesizes', '(max-width: 759px) 162vw, (max-width: 959px) 116vw, min(150vw, 1391px, calc((100vh - 160px) * 1.484))')
        document.head.appendChild(l)
      }
    </script>
    <title>Comprá Fácil — El mapa de tu ciudad</title>
    <meta
      name="description"
      content="Encontrá tiendas, servicios y emprendimientos de tu cuadra y alrededores, todos en un mapa. Buscá productos, mirá ofertas y comprá fácil, cerca tuyo."
    />
    <meta name="theme-color" content="#07070d" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Comprá Fácil" />
    <meta property="og:title" content="Comprá Fácil — El mapa de tu ciudad" />
    <meta
      property="og:description"
      content="Tiendas, servicios y emprendimientos de tu cuadra y alrededores, todos en un mapa. Encontrá lo que necesitás, cerca tuyo."
    />
    <meta property="og:image" content="https://www.comprafacil.ar/assets/logo/basket-mark-512.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
